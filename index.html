<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Dashboard Admin SDIT Al-Kautsar</title>

  <!-- Favicon -->
  <link rel="icon" href="logosit.png" type="image/png">

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,600,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Theme style AdminLTE -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  
  <style>
    body.login-page {
      background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Source Sans Pro', sans-serif;
    }

    .login-box {
      width: 400px;
      margin: 0 15px;
    }

    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3) !important;
      overflow: hidden;
      background: #ffffff;
    }

    .card-header {
      background: #ffffff;
      border-bottom: 1px solid #f0f0f0;
      padding: 30px 20px 15px 20px;
    }

    .brand-logo {
      width: 85px;
      height: auto;
      margin-bottom: 12px;
      transition: transform 0.3s ease;
    }

    .brand-logo:hover {
      transform: scale(1.05);
    }

    .card-body {
      padding: 25px 30px 30px 30px;
    }

    .form-control {
      border-radius: 8px 0 0 8px !important;
      height: 46px;
      border-right: none;
      font-size: 0.95rem;
    }

    .form-control:focus {
      border-color: #007bff;
      box-shadow: none;
    }

    .input-group-text {
      border-radius: 0 8px 8px 0 !important;
      background-color: #f8f9fa;
      border-left: none;
      color: #6c757d;
      width: 45px;
      justify-content: center;
    }

    .form-control:focus + .input-group-append .input-group-text {
      border-color: #007bff;
      color: #007bff;
    }

    .btn-primary {
      background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
      border: none;
      border-radius: 8px;
      height: 46px;
      font-size: 1rem;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0056b3 0%, #003d82 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(0, 123, 255, 0.4);
    }

    .alert {
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="hold-transition login-page">

<div class="login-box">
  <div class="card shadow-lg">
    <div class="card-header text-center">
      <!-- Logo SDIT Al-Kautsar -->
      <img src="logosit.png" alt="Logo SDIT Al-Kautsar" class="brand-logo">
      <h3 class="h4 font-weight-bold mb-0 text-primary" style="letter-spacing: 0.5px;">SDIT AL-KAUTSAR</h3>
      <small class="text-muted font-weight-semibold">Dashboard Admin Digital</small>
    </div>

    <div class="card-body">
      <p class="login-box-msg text-muted p-0 mb-4" style="font-size: 0.9rem;">
        Silakan masuk untuk memulai sesi Anda
      </p>

      <!-- Container Notifikasi Error / Sukses -->
      <div id="alertBox" class="alert d-none" role="alert"></div>

      <form id="loginForm">
        <div class="input-group mb-3">
          <input type="text" id="username" class="form-control" placeholder="Username" required autocomplete="username">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-user"></span>
            </div>
          </div>
        </div>

        <div class="input-group mb-3">
          <input type="password" id="password" class="form-control" placeholder="Password" required autocomplete="current-password">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-12">
            <div class="icheck-primary">
              <input type="checkbox" id="remember">
              <label for="remember" class="text-muted" style="font-weight: normal; cursor: pointer; user-select: none;">
                Ingat Saya
              </label>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <button type="submit" id="btnLogin" class="btn btn-primary btn-block font-weight-bold">
              <span id="btnText">Masuk</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ml-1" role="status" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<!-- Script Aplikasi -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
  $(document).ready(function () {
    // Cegah akses halaman login jika sudah memiliki sesi aktif
    if (typeof checkAlreadyLoggedIn === 'function') {
      checkAlreadyLoggedIn();
    }

    // Event Handler saat Form Login dikirim
    $('#loginForm').on('submit', async function (e) {
      e.preventDefault();

      const username = $('#username').val().trim();
      const password = $('#password').val().trim();
      const $alert = $('#alertBox');
      const $btn = $('#btnLogin');
      const $btnText = $('#btnText');
      const $btnSpinner = $('#btnSpinner');

      // Reset tampilan alert
      $alert.addClass('d-none').removeClass('alert-danger alert-success').text('');

      if (!username || !password) {
        $alert.addClass('alert-danger').removeClass('d-none').text('Username dan password wajib diisi!');
        return;
      }

      // Set status tombol loading
      $btn.prop('disabled', true);
      $btnText.text('Memproses...');
      $btnSpinner.removeClass('d-none');

      // Panggil fungsi login dari auth.js
      const hasil = await loginUser(username, password);

      if (hasil.sukses) {
        $alert.addClass('alert-success').removeClass('d-none').text('Login berhasil! Mengalihkan...');
        setTimeout(function () {
          window.location.href = 'dashboard.html';
        }, 1000);
      } else {
        $alert.addClass('alert-danger').removeClass('d-none').text(hasil.pesan);
        $btn.prop('disabled', false);
        $btnText.text('Masuk');
        $btnSpinner.addClass('d-none');
      }
    });
  });
</script>
</body>
</html>
