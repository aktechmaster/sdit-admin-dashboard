<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Dashboard Admin SDIT Al-Kautsar</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Theme style AdminLTE -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  
  <style>
    .login-page {
      background-color: #e9ecef;
    }
    .card-primary.card-outline {
      border-top: 3px solid #007bff;
    }
  </style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="card card-outline card-primary shadow">
    <div class="card-header text-center">
      <h3 class="h3 font-weight-bold mb-0 text-primary">SDIT AL-KAUTSAR</h3>
      <small class="text-muted">Dashboard Admin Digital</small>
    </div>
    <div class="card-body">
      <p class="login-box-msg">Silakan masuk untuk memulai sesi Anda</p>

      <!-- Container Notifikasi Error / Sukses -->
      <div id="alertBox" class="alert d-none" role="alert"></div>

      <form id="loginForm">
        <div class="input-group mb-3">
          <input type="text" id="username" class="form-control" placeholder="Username" required autocomplete="username">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-user"></span>
            </div>
          </div>
        </div>

        <div class="input-group mb-3">
          <input type="password" id="password" class="form-control" placeholder="Password" required autocomplete="current-password">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-8">
            <div class="icheck-primary">
              <input type="checkbox" id="remember">
              <label for="remember" style="font-weight: normal; cursor: pointer;">
                Ingat Saya
              </label>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-12">
            <button type="submit" id="btnLogin" class="btn btn-primary btn-block font-weight-bold">
              <span id="btnText">Masuk</span>
              <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<!-- Script Aplikasi -->
<script src="js/config.js"></script>
<script src="js/table-engine.js"></script>
<script src="modules/auth.js"></script>
<script src="modules/users.js"></script>
<script src="modules/guru.js"></script> <!-- Tambahkan baris ini -->
<script src="js/app.js"></script>

<!-- Script Aplikasi (Cukup panggil Konfigurasi & Autentikasi) -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
  $(document).ready(function () {
    // Cegah akses halaman login jika sudah memiliki sesi aktif
    checkAlreadyLoggedIn();

    // Event Handler saat Form Login dikirim
    $('#loginForm').on('submit', async function (e) {
      e.preventDefault();

      const username = $('#username').val().trim();
      const password = $('#password').val().trim();
      const $alert = $('#alertBox');
      const $btn = $('#btnLogin');
      const $btnText = $('#btnText');
      const $btnSpinner = $('#btnSpinner');

      // Reset tampilan alert
      $alert.addClass('d-none').removeClass('alert-danger alert-success').text('');

      if (!username || !password) {
        $alert.addClass('alert-danger').removeClass('d-none').text('Username dan password wajib diisi!');
        return;
      }

      // Set status tombol loading
      $btn.prop('disabled', true);
      $btnText.text('Memproses...');
      $btnSpinner.removeClass('d-none');

      // Panggil fungsi login dari auth.js
      const hasil = await loginUser(username, password);

      if (hasil.sukses) {
        $alert.addClass('alert-success').removeClass('d-none').text('Login berhasil! Mengalihkan...');
        setTimeout(function () {
          window.location.href = 'dashboard.html';
        }, 1000);
      } else {
        $alert.addClass('alert-danger').removeClass('d-none').text(hasil.pesan);
        $btn.prop('disabled', false);
        $btnText.text('Masuk');
        $btnSpinner.addClass('d-none');
      }
    });
  });
</script>
</body>
</html>
